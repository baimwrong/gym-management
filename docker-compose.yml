version: '3.8'

services:
  # 1. PostgreSQL 18 Database Engine
  db:
    image: postgres:latest
    container_name: gym_postgres18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-gym_management}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init_postgresql18.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gym_management"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gym_network

  # 2. Laravel 13 Application (PHP 8.3/8.4-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gym_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-gym_management}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    networks:
      - gym_network

  # 3. High Performance Nginx Web Server
  web:
    image: nginx:alpine
    container_name: gym_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - gym_network

  # 4. Redis In-Memory Cache
  redis:
    image: redis:alpine
    container_name: gym_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - gym_network

volumes:
  pgdata:
    driver: local

networks:
  gym_network:
    driver: bridge
